name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. Jobs that need more raise it themselves.
permissions:
  contents: read

# A new push to the same ref supersedes the old run. Saves CI minutes and
# stops a stale green from racing a newer red on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs, not floating tags. A tag is
# mutable: whoever controls the action repo can repoint v4 at new code, which
# would execute here with access to the workflow token. The trailing comment
# records the human-readable version the SHA corresponds to.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Don't leave the job token in .git/config, where any dependency's
          # install or build script could read it.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: npm audit (production deps, high+)
        # Only production deps ship; dev/test tooling (e.g. vitest) is not a
        # runtime surface, so gate on prod high+ only — matches sera-agents CI.
        run: npm audit --omit=dev --audit-level=high
      # Use the open-source gitleaks CLI directly. The gitleaks-action wrapper
      # requires a paid GITLEAKS_LICENSE for organizations; the CLI does not and
      # runs the same scan engine. (Matches sera-agents CI.)
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Verify the download against the release's own checksum manifest
          # before executing it. Without this the pipeline pipes an unverified
          # remote tarball straight into tar.
          grep " $tarball\$" checksums.txt | sha256sum -c -
          sudo tar -xzf "$tarball" -C /usr/local/bin gitleaks
          rm -f "$tarball" checksums.txt
          gitleaks version
      - name: Scan for secrets
        run: gitleaks detect --source . --no-git --redact --exit-code 1

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # CodeQL reads workflow run metadata to attribute alerts.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
